<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0F0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMI SARL" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMI SARL — Gestion réseau stations-service</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            // L'installation en icône reste possible sans service worker actif ;
            // seul le fonctionnement hors-ligne serait limité, ce qui n'est pas
            // gênant ici puisque l'application a de toute façon besoin du réseau
            // pour parler à la base de données partagée.
          });
        });
      }
    </script>
  </body>
</html>
